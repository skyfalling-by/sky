<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<style>
  :root {
    --gold: #fbbf24;
    --bg: #0b0f14;
    --panel: #121821;
    --text: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2430 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Courier New", "Consolas", monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 24px;
  }
  h1 {
    margin: 0;
    font-size: 30px;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 8px rgba(251, 191, 36, 0.45), 2px 2px 0 #7c2d12;
  }
  .subtitle {
    margin-top: -10px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #64748b;
  }
  .hud {
    display: flex;
    gap: 18px;
    background: var(--panel);
    border: 1px solid #26303d;
    border-radius: 8px;
    padding: 8px 22px;
    font-size: 14px;
  }
  .hud .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 58px;
  }
  .hud .stat .label {
    font-size: 10px;
    letter-spacing: 2px;
    color: #64748b;
  }
  .hud .stat span {
    font-size: 20px;
    font-weight: bold;
    color: var(--gold);
  }
  #game {
    border: 3px solid #26303d;
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    background: #05070a;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .help {
    font-size: 12px;
    letter-spacing: 1px;
    color: #64748b;
    text-align: center;
    line-height: 1.8;
  }
  .help b { color: #94a3b8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>坦克大战</h1>
  <div class="subtitle">TANK BATTLE · BATTLE CITY</div>
  <div class="hud">
    <div class="stat"><span class="label">得分</span><span id="score">0</span></div>
    <div class="stat"><span class="label">生命</span><span id="lives">3</span></div>
    <div class="stat"><span class="label">关卡</span><span id="level">1</span></div>
    <div class="stat"><span class="label">敌人</span><span id="enemies">20</span></div>
  </div>
  <canvas id="game" width="520" height="520"></canvas>
  <div class="help">
    <b>方向键 / WASD</b> 移动 &nbsp;·&nbsp; <b>空格 / J</b> 射击 &nbsp;·&nbsp; <b>P</b> 暂停 &nbsp;·&nbsp; <b>M</b> 静音<br>
    <b>回车</b> 开始 / 下一关 · 守住基地并消灭所有敌人
  </div>
</div>

<script>
(function () {
  'use strict';

  // ===================== Canvas & 常量 =====================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const TILE = 40;
  const COLS = 13;
  const ROWS = 13;
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;

  const TANK = TILE;            // 逻辑碰撞尺寸（恰好一格）
  const TANK_DRAW = TILE - 4;   // 视觉尺寸（留边）
  const BULLET_SIZE = 8;
  const BULLET_SPEED = 420;
  const PLAYER_SPEED = 135;
  const ENEMY_SPEED_BASE = 68;
  const MAX_ENEMIES = 3;
  const ENEMIES_PER_LEVEL = 20;

  // 地块类型
  const EMPTY = 0, BRICK = 1, STEEL = 2, WATER = 3, TREE = 4, BASE = 5;
  const CHAR = { '.': EMPTY, '#': BRICK, '@': STEEL, '~': WATER, 'T': TREE, 'B': BASE };

  // 方向：0 上 1 右 2 下 3 左
  const DX = [0, 1, 0, -1];
  const DY = [-1, 0, 1, 0];

  // ===================== 关卡地图 (13 x 13) =====================
  const MAPS = [
    [
      ".............",
      ".............",
      ".#.#.#.#.#.#.",
      ".............",
      ".##.##.##.##.",
      ".............",
      ".#.#.#.#.#.#.",
      ".............",
      ".##.##.##.##.",
      ".............",
      ".............",
      ".....###.....",
      ".....#B#.....",
    ],
    [
      ".............",
      ".##....##..##",
      ".##....##..##",
      ".............",
      ".@@.##.##.@@.",
      ".............",
      ".~~..#.#..~~.",
      ".............",
      ".##.##.##.##.",
      ".............",
      ".............",
      ".....###.....",
      ".....#B#.....",
    ],
    [
      ".............",
      ".##..@.@..##.",
      ".##..@.@..##.",
      ".............",
      ".@#.##.##.#@.",
      ".............",
      ".~~.#.#.#.~~.",
      ".............",
      ".T#.##.##.#T.",
      ".............",
      ".............",
      ".....###.....",
      ".....#B#.....",
    ],
  ];

  // ===================== 音效 =====================
  let audioCtx = null;
  let muted = false;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol) {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.value = vol || 0.1;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  }
  function noise(dur, vol) {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const g = audioCtx.createGain();
    g.gain.value = vol || 0.2;
    src.connect(g); g.connect(audioCtx.destination);
    src.start();
  }
  const Sound = {
    shoot: function () { beep(880, 0.07, 'square', 0.06); },
    hit: function () { noise(0.08, 0.12); },
    explode: function () { noise(0.28, 0.22); beep(110, 0.2, 'sawtooth', 0.12); },
    powerup: function () {
      beep(660, 0.08); setTimeout(function () { beep(880, 0.08); }, 90);
      setTimeout(function () { beep(1320, 0.14); }, 180);
    },
    gameover: function () {
      beep(400, 0.25, 'sawtooth', 0.14);
      setTimeout(function () { beep(200, 0.5, 'sawtooth', 0.14); }, 240);
    },
    stage: function () {
      beep(523, 0.1); setTimeout(function () { beep(659, 0.1); }, 110);
      setTimeout(function () { beep(784, 0.1); }, 220);
      setTimeout(function () { beep(1046, 0.18); }, 330);
    },
  };

  // ===================== 工具函数 =====================
  function aabb(a, b) {
    return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;
  }
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = Math.max(0, Math.min(255, r));
    g = Math.max(0, Math.min(255, g));
    b = Math.max(0, Math.min(255, b));
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  const el = function (id) { return document.getElementById(id); };

  // ===================== 输入 =====================
  const DIR_KEY = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  const FIRE_KEYS = { Space: true, KeyJ: true, KeyX: true };
  let dirQueue = [];
  let fireHeld = false;

  window.addEventListener('keydown', function (e) {
    if (DIR_KEY[e.code] !== undefined) {
      e.preventDefault();
      const d = DIR_KEY[e.code];
      dirQueue = dirQueue.filter(function (x) { return x !== d; });
      dirQueue.push(d);
    } else if (FIRE_KEYS[e.code]) {
      e.preventDefault();
      fireHeld = true;
      if (state === 'playing') { ensureAudio(); }
    } else if (e.code === 'Enter') {
      if (state === 'menu' || state === 'gameover') startGame();
      else if (state === 'stageclear') { level++; startLevel(); state = 'playing'; }
    } else if (e.code === 'KeyP') {
      if (state === 'playing') state = 'paused';
      else if (state === 'paused') state = 'playing';
    } else if (e.code === 'KeyM') {
      muted = !muted;
    }
  });
  window.addEventListener('keyup', function (e) {
    if (DIR_KEY[e.code] !== undefined) {
      const d = DIR_KEY[e.code];
      dirQueue = dirQueue.filter(function (x) { return x !== d; });
    } else if (FIRE_KEYS[e.code]) {
      fireHeld = false;
    }
  });

  // ===================== 游戏状态 =====================
  let state = 'menu';   // menu | playing | paused | gameover | stageclear
  let map = [];
  let baseR = 12, baseC = 6, baseAlive = true;
  let player = null;
  let enemies = [], bullets = [], powerups = [], particles = [];
  let score = 0, lives = 3, level = 1;
  let toSpawn = 0, remainingToKill = 0;
  let spawnTimer = 0, powerupTimer = 0, stageTimer = 0;
  let time = 0;

  // ===================== 实体类 =====================
  class Tank {
    constructor(x, y, dir, opts) {
      this.x = x; this.y = y; this.dir = dir;
      this.speed = opts.speed;
      this.isPlayer = opts.isPlayer;
      this.color = opts.color;
      this.maxBullets = opts.maxBullets || 1;
      this.shield = opts.shield || 0;   // 无敌时间（秒）
      this.spawn = opts.spawn || 0;     // 出生动画计时
      this.cooldown = 0;
      this.moveTimer = 0;
      this.shootTimer = 0;
      this.alive = true;
    }
    get cx() { return this.x + TANK / 2; }
    get cy() { return this.y + TANK / 2; }
    box() { return { x: this.x, y: this.y, w: TANK, h: TANK }; }
  }

  class Bullet {
    constructor(x, y, dir, owner) {
      this.x = x; this.y = y; this.dir = dir; this.owner = owner;
      this.alive = true;
    }
    get cx() { return this.x + BULLET_SIZE / 2; }
    get cy() { return this.y + BULLET_SIZE / 2; }
    box() { return { x: this.x, y: this.y, w: BULLET_SIZE, h: BULLET_SIZE }; }
  }

  // ===================== 关卡加载 =====================
  function loadMap(idx) {
    const rows = MAPS[(idx - 1) % MAPS.length];
    map = rows.map(function (line) {
      return line.split('').map(function (ch) { return CHAR[ch] !== undefined ? CHAR[ch] : EMPTY; });
    });
    baseR = 12; baseC = 6; baseAlive = true;
    // 兜底：从地图中定位基地
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === BASE) { baseR = r; baseC = c; }
      }
    }
  }

  function enemyOpts() {
    return {
      speed: ENEMY_SPEED_BASE + (level - 1) * 8 + Math.random() * 8,
      isPlayer: false,
      color: '#cbd5e1',
      maxBullets: 1,
    };
  }

  function startLevel() {
    loadMap(level);
    enemies = [];
    bullets = [];
    powerups = [];
    particles = [];
    toSpawn = ENEMIES_PER_LEVEL;
    remainingToKill = ENEMIES_PER_LEVEL;
    spawnTimer = 0.4;
    powerupTimer = 8;
    player = new Tank(4 * TILE, 12 * TILE, 0, {
      speed: PLAYER_SPEED, isPlayer: true, color: '#facc15', maxBullets: 1,
    });
    player.shield = 3;
    updateHUD();
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    startLevel();
    state = 'playing';
    ensureAudio();
  }

  function updateHUD() {
    el('score').textContent = score;
    el('lives').textContent = Math.max(lives, 0);
    el('level').textContent = level;
    el('enemies').textContent = remainingToKill;
  }

  function addScore(n) { score += n; updateHUD(); }

  // ===================== 碰撞与移动 =====================
  function solidAt(px, py) {
    const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
    if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
    const t = map[r][c];
    return t === BRICK || t === STEEL || t === WATER || t === BASE;
  }

  function allTanks() {
    const list = enemies.slice();
    if (player && player.alive) list.push(player);
    return list;
  }

  function canMove(x, y, self) {
    const pts = [[x, y], [x + TANK - 1, y], [x, y + TANK - 1], [x + TANK - 1, y + TANK - 1]];
    for (let i = 0; i < pts.length; i++) {
      if (solidAt(pts[i][0], pts[i][1])) return false;
    }
    const nb = { x: x, y: y, w: TANK, h: TANK };
    const tanks = allTanks();
    for (let i = 0; i < tanks.length; i++) {
      const t = tanks[i];
      if (t === self || !t.alive) continue;
      if (aabb(nb, t.box())) return false;
    }
    return true;
  }

  function moveTank(tank, dir, dt) {
    if (dir !== tank.dir) {
      tank.dir = dir;
      // 转向时吸附到网格（垂直运动对齐 x，水平运动对齐 y）
      if (dir === 0 || dir === 2) tank.x = Math.round(tank.x / TILE) * TILE;
      else tank.y = Math.round(tank.y / TILE) * TILE;
    }
    const nx = tank.x + DX[dir] * tank.speed * dt;
    const ny = tank.y + DY[dir] * tank.speed * dt;
    if (canMove(nx, ny, tank)) {
      tank.x = nx; tank.y = ny;
      return true;
    }
    // 被阻挡时也吸附，避免卡在半格位置
    if (dir === 0 || dir === 2) tank.x = Math.round(tank.x / TILE) * TILE;
    else tank.y = Math.round(tank.y / TILE) * TILE;
    return false;
  }

  function fire(tank) {
    if (tank.cooldown > 0) return;
    let mine = 0;
    for (let i = 0; i < bullets.length; i++) if (bullets[i].owner === tank) mine++;
    if (mine >= tank.maxBullets) return;
    tank.cooldown = tank.isPlayer ? 0.26 : 0.9;
    const d = TANK / 2 + 4;
    const bx = tank.cx + DX[tank.dir] * d - BULLET_SIZE / 2;
    const by = tank.cy + DY[tank.dir] * d - BULLET_SIZE / 2;
    bullets.push(new Bullet(bx, by, tank.dir, tank));
    Sound.shoot();
  }

  // ===================== 特效 =====================
  function addExplosion(cx, cy, color) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 30 + Math.random() * 90;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.45, color: color,
      });
    }
  }

  // ===================== 摧毁 / 胜负 =====================
  function destroyTank(tk) {
    tk.alive = false;
    addExplosion(tk.cx, tk.cy, tk.color);
    Sound.explode();
    if (tk.isPlayer) {
      lives--;
      updateHUD();
      if (lives < 0) { gameOver(); }
      else { respawnPlayer(); }
    } else {
      addScore(100);
      remainingToKill--;
      updateHUD();
      checkWin();
    }
  }

  function respawnPlayer() {
    player = new Tank(4 * TILE, 12 * TILE, 0, {
      speed: PLAYER_SPEED, isPlayer: true, color: '#facc15', maxBullets: 1,
    });
    player.shield = 3;
  }

  function destroyBase() {
    if (!baseAlive) return;
    baseAlive = false;
    map[baseR][baseC] = EMPTY;
    addExplosion(baseC * TILE + TILE / 2, baseR * TILE + TILE / 2, '#dc2626');
    Sound.explode();
    gameOver();
  }

  function checkWin() {
    if (remainingToKill <= 0 && toSpawn <= 0) {
      let anyAlive = false;
      for (let i = 0; i < enemies.length; i++) if (enemies[i].alive) anyAlive = true;
      if (!anyAlive) stageClear();
    }
  }

  function gameOver() {
    state = 'gameover';
    Sound.gameover();
  }

  function stageClear() {
    state = 'stageclear';
    stageTimer = 2.5;
    addScore(1000);
    Sound.stage();
  }

  // ===================== 敌人 AI 与生成 =====================
  function updateSpawn(dt) {
    let alive = 0;
    for (let i = 0; i < enemies.length; i++) if (enemies[i].alive) alive++;
    if (toSpawn > 0 && alive < MAX_ENEMIES) {
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        if (trySpawnEnemy()) toSpawn--;
        spawnTimer = 1.2;
      }
    }
  }

  function trySpawnEnemy() {
    const spots = [[0, 0], [6, 0], [12, 0]];
    const free = [];
    for (let i = 0; i < spots.length; i++) {
      const c = spots[i][0], r = spots[i][1];
      const bx = c * TILE, by = r * TILE;
      let occupied = false;
      const tanks = allTanks();
      for (let j = 0; j < tanks.length; j++) {
        if (aabb({ x: bx, y: by, w: TANK, h: TANK }, tanks[j].box())) { occupied = true; break; }
      }
      if (!occupied) free.push(spots[i]);
    }
    if (!free.length) return false;
    const spot = free[Math.floor(Math.random() * free.length)];
    const e = new Tank(spot[0] * TILE, spot[1] * TILE, 2, enemyOpts());
    e.spawn = 1.2;
    enemies.push(e);
    return true;
  }

  function chooseDir(t) {
    if (Math.random() < 0.32 && player && player.alive) {
      const dxp = player.cx - t.cx, dyp = player.cy - t.cy;
      if (Math.abs(dxp) > Math.abs(dyp)) return dxp > 0 ? 1 : 3;
      return dyp > 0 ? 2 : 0;
    }
    return Math.floor(Math.random() * 4);
  }

  function updateEnemy(t, dt) {
    t.cooldown -= dt;
    t.shield -= dt;
    if (t.spawn > 0) { t.spawn -= dt; return; }

    t.moveTimer -= dt;
    t.shootTimer -= dt;

    let wish = t.dir;
    if (t.moveTimer <= 0) {
      t.moveTimer = 0.8 + Math.random() * 1.8;
      wish = chooseDir(t);
    }

    // moveTank 在方向变化时会吸附到网格
    if (!moveTank(t, wish, dt)) {
      if (Math.random() < 0.6) moveTank(t, Math.floor(Math.random() * 4), dt);
      t.moveTimer = Math.max(t.moveTimer, 0.2);
    }

    if (t.shootTimer <= 0) {
      t.shootTimer = 1.0 + Math.random() * 2.0;
      fire(t);
    }
  }

  // ===================== 道具 =====================
  function updatePowerups(dt) {
    powerupTimer -= dt;
    if (powerupTimer <= 0 && powerups.length === 0) {
      spawnPowerup();
      powerupTimer = 12;
    }
    for (let i = 0; i < powerups.length; i++) {
      const p = powerups[i];
      p.life -= dt;
      if (p.life <= 0) { p.alive = false; continue; }
      if (player && player.alive && aabb(player.box(), p.box())) {
        applyPowerup(p);
        p.alive = false;
      }
    }
    powerups = powerups.filter(function (p) { return p.alive; });
  }

  function spawnPowerup() {
    for (let i = 0; i < 60; i++) {
      const c = 1 + Math.floor(Math.random() * (COLS - 2));
      const r = 1 + Math.floor(Math.random() * (ROWS - 2));
      if (map[r][c] === EMPTY) {
        const types = ['life', 'shield', 'power'];
        const type = types[Math.floor(Math.random() * types.length)];
        powerups.push({
          x: c * TILE, y: r * TILE, type: type, life: 8, alive: true,
          box: function () { return { x: this.x, y: this.y, w: TILE, h: TILE }; },
        });
        return;
      }
    }
  }

  function applyPowerup(p) {
    Sound.powerup();
    if (p.type === 'life') { lives = Math.min(lives + 1, 9); addScore(500); }
    else if (p.type === 'shield') { player.shield = 10; addScore(500); }
    else if (p.type === 'power') { player.maxBullets = 2; addScore(500); }
    updateHUD();
  }

  // ===================== 更新 =====================
  function update(dt) {
    if (state === 'playing') {
      updatePlayer(dt);
      for (let i = 0; i < enemies.length; i++) if (enemies[i].alive) updateEnemy(enemies[i], dt);
      updateSpawn(dt);
      updateBullets(dt);
      updatePowerups(dt);
    } else if (state === 'stageclear') {
      stageTimer -= dt;
      if (stageTimer <= 0) { level++; startLevel(); state = 'playing'; }
    }
    // 粒子始终更新（含 gameover 等状态）
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    }
    particles = particles.filter(function (p) { return p.life > 0; });
  }

  function updatePlayer(dt) {
    if (!player || !player.alive) return;
    player.cooldown -= dt;
    player.shield -= dt;
    if (fireHeld) fire(player);
    let dir = dirQueue.length ? dirQueue[dirQueue.length - 1] : null;
    if (dir !== null) moveTank(player, dir, dt);
  }

  function updateBullets(dt) {
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      b.x += DX[b.dir] * BULLET_SPEED * dt;
      b.y += DY[b.dir] * BULLET_SPEED * dt;
      const cx = b.cx, cy = b.cy;
      if (cx < 0 || cy < 0 || cx >= canvas.width || cy >= canvas.height) {
        b.alive = false; continue;
      }
      const c = Math.floor(cx / TILE), r = Math.floor(cy / TILE);
      const t = map[r][c];
      if (t === BRICK) {
        map[r][c] = EMPTY;
        addExplosion(c * TILE + TILE / 2, r * TILE + TILE / 2, '#b45309');
        b.alive = false;
        if (b.owner && b.owner.isPlayer) addScore(10);
        Sound.hit();
        continue;
      } else if (t === STEEL) {
        b.alive = false;
        addExplosion(cx, cy, '#cbd5e1');
        Sound.hit();
        continue;
      } else if (t === BASE) {
        b.alive = false;
        destroyBase();
        continue;
      }
      // 命中坦克
      const targets = b.owner && b.owner.isPlayer ? enemies : (player && player.alive ? [player] : []);
      for (let j = 0; j < targets.length; j++) {
        const tk = targets[j];
        if (!tk.alive || tk.spawn > 0 || tk.shield > 0) continue;
        if (aabb(b.box(), tk.box())) {
          b.alive = false;
          destroyTank(tk);
          break;
        }
      }
    }
    bullets = bullets.filter(function (b) { return b.alive; });
  }

  // ===================== 渲染 =====================
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#05070a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawTiles();
    for (let i = 0; i < powerups.length; i++) drawPowerup(powerups[i]);

    // 坦克
    for (let i = 0; i < enemies.length; i++) if (enemies[i].alive) drawTank(enemies[i]);
    if (player && player.alive) drawTank(player);

    // 子弹
    ctx.fillStyle = '#fde68a';
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.fillRect(b.x, b.y, BULLET_SIZE, BULLET_SIZE);
    }

    // 粒子
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(p.life / 0.45, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    // 草丛画在最上层（半透明，遮挡坦克）
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (map[r][c] === TREE) drawTree(c * TILE, r * TILE);
      }
    }

    drawOverlay();
  }

  function drawTiles() {
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        const x = c * TILE, y = r * TILE;
        if (t === BRICK) drawBrick(x, y);
        else if (t === STEEL) drawSteel(x, y);
        else if (t === WATER) drawWater(x, y);
        else if (t === BASE) drawBase(x, y);
      }
    }
  }

  function drawBrick(x, y) {
    ctx.fillStyle = '#b45309';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#7c2d12';
    ctx.fillRect(x, y + TILE * 0.5 - 1, TILE, 2);
    ctx.fillRect(x + TILE * 0.25, y, 2, TILE * 0.5);
    ctx.fillRect(x + TILE * 0.75, y + TILE * 0.5, 2, TILE * 0.5);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fillRect(x, y, TILE, 2);
  }

  function drawSteel(x, y) {
    ctx.fillStyle = '#94a3b8';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#cbd5e1';
    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(x + 2, y + 2, TILE - 4, 5);
    ctx.fillStyle = '#475569';
    ctx.fillRect(x + 6, y + 6, 4, 4);
    ctx.fillRect(x + TILE - 10, y + 6, 4, 4);
    ctx.fillRect(x + 6, y + TILE - 10, 4, 4);
    ctx.fillRect(x + TILE - 10, y + TILE - 10, 4, 4);
  }

  function drawWater(x, y) {
    ctx.fillStyle = '#1e40af';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#3b82f6';
    const off = (time * 30) % (TILE / 2);
    for (let i = -1; i < 3; i++) {
      const wy = y + i * (TILE / 2) + off;
      ctx.fillRect(x, wy, TILE, 3);
    }
  }

  function drawTree(x, y) {
    ctx.fillStyle = 'rgba(22,101,52,0.92)';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = 'rgba(34,150,66,0.85)';
    ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = 'rgba(21,128,61,0.95)';
    ctx.fillRect(x + 8, y + 8, 8, 8);
    ctx.fillRect(x + TILE - 16, y + TILE - 16, 8, 8);
  }

  function drawBase(x, y) {
    ctx.fillStyle = '#4b5563';
    ctx.fillRect(x, y, TILE, TILE);
    ctx.fillStyle = '#6b7280';
    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
    if (baseAlive) {
      ctx.fillStyle = '#9ca3af';
      ctx.fillRect(x + TILE * 0.5 - 2, y + TILE * 0.18, 4, TILE * 0.62);
      ctx.fillStyle = '#dc2626';
      ctx.beginPath();
      ctx.moveTo(x + TILE * 0.5 + 2, y + TILE * 0.18);
      ctx.lineTo(x + TILE * 0.5 + 2 + TILE * 0.4, y + TILE * 0.3);
      ctx.lineTo(x + TILE * 0.5 + 2, y + TILE * 0.42);
      ctx.closePath();
      ctx.fill();
      drawStar(x + TILE * 0.5 + 2 + TILE * 0.14, y + TILE * 0.3, 5, 5, 2, '#fbbf24');
    } else {
      ctx.fillStyle = '#1f2937';
      ctx.fillRect(x + 4, y + 4, TILE - 8, TILE - 8);
      ctx.fillStyle = '#374151';
      ctx.fillRect(x + 8, y + 20, TILE - 16, 8);
    }
  }

  function drawStar(cx, cy, spikes, outer, inner, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < spikes * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (Math.PI / spikes) * i - Math.PI / 2;
      const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawTank(t) {
    const cx = t.cx, cy = t.cy;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.dir * Math.PI / 2);
    const s = TANK_DRAW, h = s / 2;
    // 履带
    ctx.fillStyle = shade(t.color, -42);
    ctx.fillRect(-h, -h, s * 0.22, s);
    ctx.fillRect(h - s * 0.22, -h, s * 0.22, s);
    // 车体
    ctx.fillStyle = t.color;
    ctx.fillRect(-h + s * 0.18, -h + s * 0.08, s * 0.64, s * 0.84);
    // 炮塔
    ctx.fillStyle = shade(t.color, 24);
    ctx.fillRect(-s * 0.15, -s * 0.15, s * 0.3, s * 0.3);
    // 炮管
    ctx.fillStyle = shade(t.color, -14);
    ctx.fillRect(-s * 0.06, -s * 0.5, s * 0.12, s * 0.42);
    ctx.restore();

    // 出生 / 无敌闪烁
    if ((t.spawn > 0 || t.shield > 0) && Math.floor(time * 10) % 2 === 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.strokeRect(t.x + 1, t.y + 1, TANK - 2, TANK - 2);
    }
  }

  function drawPowerup(p) {
    if (p.life < 3 && Math.floor(time * 6) % 2 === 0) return;
    const x = p.x, y = p.y;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
    ctx.strokeStyle = '#fbbf24';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 3, y + 3, TILE - 6, TILE - 6);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '20px "Courier New", monospace';
    ctx.fillStyle = '#fbbf24';
    const icon = p.type === 'life' ? '❤' : p.type === 'shield' ? '🛡' : '⭐';
    ctx.fillText(icon, x + TILE / 2, y + TILE / 2 + 1);
  }

  function drawOverlay() {
    if (state === 'menu') {
      overlay('坦克大战', ['回车键开始游戏', '守住基地 · 消灭敌人']);
    } else if (state === 'paused') {
      overlay('暂停', ['按 P 继续']);
    } else if (state === 'gameover') {
      overlay('游戏结束', ['得分 ' + score, '按回车键重新开始']);
    } else if (state === 'stageclear') {
      overlay('关卡完成', ['得分 ' + score, '即将进入下一关…']);
    }
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fbbf24';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 30);
    ctx.fillStyle = '#e5e7eb';
    ctx.font = '16px "Courier New", monospace';
    for (let i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], canvas.width / 2, canvas.height / 2 + 24 + i * 26);
    }
  }

  // ===================== 主循环 =====================
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
