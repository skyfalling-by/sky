<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0984e3">
<title>我的时间表</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#8a91a3; --line:#e7e9f0;
    --accent:#0984e3; --accent-soft:#e8f3fd; --danger:#e5484d; --ok:#2fbf71;
    --radius:14px; --shadow:0 1px 3px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;
  }

  header{
    position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
    padding:16px 18px 14px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  }
  header h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}

  .nav{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:820px;margin:0 auto}
  .nav .month{flex:1;text-align:center;font-size:17px;font-weight:700}
  .nav-btn{border:none;background:var(--card);color:var(--text);width:36px;height:36px;border-radius:10px;
    cursor:pointer;font-size:16px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
  .nav-btn.today{width:auto;padding:0 12px;font-size:13px;color:var(--accent);font-weight:600}

  .wrap{max-width:820px;margin:0 auto;padding:0 14px 40px}

  /* 日历 */
  .calendar{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
  .weekdays span{text-align:center;font-size:12px;color:var(--muted);padding:9px 0;font-weight:600}
  .weekdays span.wk{color:#e17055}
  .days{display:grid;grid-template-columns:repeat(7,1fr)}
  .day{
    position:relative;min-height:52px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;user-select:none;transition:background .12s;
  }
  .day:nth-child(7n){border-right:none}
  .day.dim{color:#cdd2dd}
  .day:hover{background:var(--bg)}
  .day .num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
  .day.today .num{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .day.wk .num{color:#e17055}
  .day.holiday .num{color:#e5484d}
  .day.is-work .num{color:var(--text)}
  .day.selected .num{background:var(--accent);color:#fff;font-weight:700}
  .day .holiday-label{font-size:9px;line-height:1;color:#e5484d;font-weight:600;letter-spacing:.3px}
  .day .holiday-label.work{color:#b0b7c3}
  .day.dim .holiday-label{opacity:.4}
  .dots{display:flex;gap:3px;height:5px}
  .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:block}
  .dots i.done-all{background:var(--ok)}
  .legend{display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--muted);padding:8px 0 2px;flex-wrap:wrap}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
  .legend i.h{background:#e5484d}
  .legend i.w{background:#b0b7c3}
  .legend i.t{background:var(--accent)}

  /* 当日任务区 */
  .day-panel{margin-top:16px}
  .day-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  .day-head-left{display:flex;align-items:baseline;flex-wrap:wrap}
  .day-head h2{margin:0;font-size:18px}
  .day-head .weekday{color:var(--muted);font-size:13px;margin-left:8px}
  .day-head .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

  .add-row{display:flex;gap:8px;margin-bottom:12px}
  .add-row input[type=text]{
    flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;
    background:var(--card);color:var(--text);outline:none;font-family:inherit;min-width:0;transition:border .15s;
  }
  .add-row input:focus{border-color:var(--accent)}
  .add-row input[type=time]{
    flex:0 0 auto;width:105px;padding:11px 8px;border:1px solid var(--line);border-radius:12px;
    font-size:14px;background:var(--card);color:var(--text);outline:none;font-family:inherit;
  }
  .add-btn{
    flex:0 0 auto;padding:0 18px;border:none;border-radius:12px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .add-btn:active{opacity:.85}

  .task{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:8px;
    padding:12px 14px;display:flex;align-items:center;gap:12px;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .check{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid #cdd2dd;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:#fff;color:#fff;font-size:13px;font-weight:700;transition:all .15s}
  .check.done{background:var(--ok);border-color:var(--ok)}
  .task-body{flex:1;min-width:0}
  .task-text{font-size:15px;word-break:break-word}
  .task.done .task-text{color:var(--muted);text-decoration:line-through}
  .task-time{font-size:12px;color:var(--accent);font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
  .task .del{flex:0 0 auto;border:none;background:transparent;color:var(--muted);cursor:pointer;
    width:28px;height:28px;border-radius:8px;font-size:14px;opacity:0;transition:all .15s}
  .task:hover .del{opacity:1}
  .task .del:hover{color:var(--danger);background:#fdeaeb}

  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty .big{font-size:44px;margin-bottom:10px}
  .empty p{margin:0;font-size:14px}

  @media (min-width:700px){
    .wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start;padding-top:8px}
    .day-panel{margin-top:0}
    .day{min-height:72px}
  }
</style>
</head>
<body>

<header>
  <h1>🗓️ 我的时间表</h1>
  <div class="sub">在每一天下面记下当天要做的事</div>
</header>

<div class="nav">
  <button class="nav-btn" id="btnPrev">‹</button>
  <div class="month" id="monthLabel"></div>
  <button class="nav-btn" id="btnNext">›</button>
  <button class="nav-btn today" id="btnToday">今天</button>
</div>

<div class="wrap">
  <div class="calendar">
    <div class="weekdays">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="wk">六</span><span class="wk">日</span>
    </div>
    <div class="days" id="days"></div>
  </div>
  <div class="legend">
    <span><i class="h"></i>节假日</span>
    <span><i class="w"></i>调休上班</span>
    <span><i class="t"></i>有任务</span>
  </div>

  <div class="day-panel">
    <div class="day-head">
      <div class="day-head-left">
        <h2 id="dayTitle"></h2>
        <span class="weekday" id="dayWeek"></span>
      </div>
      <span class="count" id="dayCount"></span>
    </div>
    <div class="add-row">
      <input type="text" id="newText" placeholder="添加当天事项…" maxlength="120">
      <input type="time" id="newTime">
      <button class="add-btn" id="btnAdd">＋</button>
    </div>
    <div id="taskList"></div>
  </div>
</div>

<script>
(function(){
  'use strict';

  const KEY = 'schedule-v1';

  // ---------- 2026年法定节假日（来源：国务院办公厅通知） ----------
  // 格式：日期 -> 节日名；调休上班的周末单独列出
  const HOLIDAYS = {
    '2026-01-01':'元旦','2026-01-02':'元旦','2026-01-03':'元旦',
    '2026-02-15':'春节','2026-02-16':'春节','2026-02-17':'春节','2026-02-18':'春节',
    '2026-02-19':'春节','2026-02-20':'春节','2026-02-21':'春节','2026-02-22':'春节','2026-02-23':'春节',
    '2026-04-04':'清明节','2026-04-05':'清明节','2026-04-06':'清明节',
    '2026-05-01':'劳动节','2026-05-02':'劳动节','2026-05-03':'劳动节','2026-05-04':'劳动节','2026-05-05':'劳动节',
    '2026-06-19':'端午节','2026-06-20':'端午节','2026-06-21':'端午节',
    '2026-09-25':'中秋节','2026-09-26':'中秋节','2026-09-27':'中秋节',
    '2026-10-01':'国庆节','2026-10-02':'国庆节','2026-10-03':'国庆节','2026-10-04':'国庆节',
    '2026-10-05':'国庆节','2026-10-06':'国庆节','2026-10-07':'国庆节',
  };
  // 调休上班日（本该周末休息，但要上班）
  const WORKDAYS = {
    '2026-01-04':1,'2026-02-14':1,'2026-02-28':1,'2026-05-09':1,
    '2026-09-20':1,'2026-10-10':1,
  };

  // ---------- 数据 ----------
  let data = load();
  function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && typeof d==='object') return d; }catch(e){} return {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function tasksOf(dateStr){ return data[dateStr] || []; }

  // ---------- 状态 ----------
  const today = new Date();
  let viewY = today.getFullYear();
  let viewM = today.getMonth();      // 0-based
  let sel = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  // ---------- 日期工具 ----------
  function pad(n){ return String(n).padStart(2,'0'); }
  function keyOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function sameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const daysEl = $('days'), monthLabel = $('monthLabel');

  // ---------- 渲染日历 ----------
  function renderCalendar(){
    monthLabel.textContent = viewY + '年 ' + (viewM+1) + '月';

    const first = new Date(viewY, viewM, 1);
    const daysInMonth = new Date(viewY, viewM+1, 0).getDate();
    // 周一为一周第一天：getDay() 0=周日 → 转为 (6,0,1,2,3,4,5)
    const lead = (first.getDay() + 6) % 7;

    let html = '';
    // 前置空位（上个月补位）
    const prevDays = new Date(viewY, viewM, 0).getDate();
    for(let i=lead-1; i>=0; i--){
      html += dayCell(prevDays-i, true, false);
    }
    // 当月
    for(let d=1; d<=daysInMonth; d++){
      html += dayCell(d, false, true);
    }
    // 后置补位
    const total = lead + daysInMonth;
    const tail = (7 - total%7) % 7;
    for(let i=1; i<=tail; i++){
      html += dayCell(i, true, false);
    }
    daysEl.innerHTML = html;
  }

  function dayCell(dayNum, dim, inMonth){
    const d = new Date(viewY, viewM, dayNum);
    const k = keyOf(d);
    const ts = tasksOf(k);
    const isToday = sameDay(d, today);
    const isSel = sameDay(d, sel);
    const isWk = d.getDay()===0 || d.getDay()===6;
    const hName = HOLIDAYS[k] || '';
    const isWork = WORKDAYS[k];
    let cls = 'day' + (dim?' dim':'') + (isToday?' today':'') + (isSel?' selected':'') + (isWk?' wk':'');
    if(hName) cls += ' holiday';
    if(isWork) cls += ' is-work';
    // 节日名标签（调休上班显示「班」）
    let label = '';
    if(hName) label = `<div class="holiday-label">${hName}</div>`;
    else if(isWork) label = `<div class="holiday-label work">班</div>`;
    let dots = '';
    if(ts.length){
      const allDone = ts.every(t=>t.done);
      dots = `<div class="dots">${ts.slice(0,4).map(t=>`<i class="${t.done?'done-all':''}"></i>`).join('')}</div>`;
    }
    return `<div class="${cls}" data-key="${k}" data-inmonth="${inMonth?1:0}">` +
      `<div class="num">${dayNum}</div>` + label + dots + `</div>`;
  }

  // ---------- 渲染当日任务 ----------
  function renderDay(){
    const k = keyOf(sel);
    $('dayTitle').textContent = (sel.getMonth()+1)+'月'+sel.getDate()+'日';
    const hName = HOLIDAYS[k] || '';
    const isWork = WORKDAYS[k];
    let wk = WEEK[sel.getDay()];
    if(hName) wk += ' · ' + hName;
    else if(isWork) wk += ' · 调休上班';
    $('dayWeek').textContent = wk;
    const ts = tasksOf(k);
    $('dayCount').textContent = ts.length ? (ts.filter(t=>t.done).length + '/' + ts.length + ' 完成') : '';
    // 排序：未完成在前，再按时间
    const sorted = [...ts].sort((a,b)=>{
      if(a.done!==b.done) return a.done?1:-1;
      return (a.time||'').localeCompare(b.time||'');
    });

    let html = '';
    if(sorted.length===0){
      html = `<div class="empty"><div class="big">📝</div><p>这一天还没有安排，添加一条吧</p></div>`;
    }else{
      sorted.forEach(t=>{
        html += `<div class="task ${t.done?'done':''}" data-id="${t.id}">
          <div class="check ${t.done?'done':''}" data-check="${t.id}">${t.done?'✓':''}</div>
          <div class="task-body">
            <div class="task-text">${esc(t.text)}</div>
            ${t.time?`<div class="task-time">🕐 ${t.time}</div>`:''}
          </div>
          <button class="del" data-del="${t.id}" title="删除">✕</button>
        </div>`;
      });
    }
    $('taskList').innerHTML = html;
  }

  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---------- 交互 ----------
  daysEl.addEventListener('click', e=>{
    const cell = e.target.closest('[data-key]');
    if(!cell) return;
    if(cell.dataset.inmonth!=='1'){ // 点击补位日期则跳转月份
      const num = parseInt(cell.querySelector('.num').textContent);
      if(num > 15){ sel = new Date(viewY, viewM-1, num); viewY = sel.getFullYear(); viewM = sel.getMonth(); }
      else{ sel = new Date(viewY, viewM+1, num); viewY = sel.getFullYear(); viewM = sel.getMonth(); }
    }else{
      sel = new Date(viewY, viewM, parseInt(cell.querySelector('.num').textContent));
    }
    renderCalendar(); renderDay();
  });

  $('btnPrev').onclick = ()=>{ viewM--; if(viewM<0){ viewM=11; viewY--; } renderCalendar(); };
  $('btnNext').onclick = ()=>{ viewM++; if(viewM>11){ viewM=0; viewY++; } renderCalendar(); };
  $('btnToday').onclick = ()=>{ sel = new Date(today.getFullYear(),today.getMonth(),today.getDate()); viewY=sel.getFullYear(); viewM=sel.getMonth(); renderCalendar(); renderDay(); };

  function addTask(){
    const text = $('newText').value.trim();
    if(!text){ $('newText').focus(); return; }
    const k = keyOf(sel);
    const time = $('newTime').value;
    if(!data[k]) data[k] = [];
    data[k].push({ id:uid(), text, time:time||null, done:false, created:Date.now() });
    save(); renderCalendar(); renderDay();
    $('newText').value=''; $('newTime').value=''; $('newText').focus();
  }
  $('btnAdd').onclick = addTask;
  $('newText').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addTask(); } });

  $('taskList').addEventListener('click', e=>{
    const check = e.target.closest('[data-check]');
    if(check){ const k=keyOf(sel); const t=data[k]?.find(x=>x.id===check.dataset.check); if(t){ t.done=!t.done; save(); renderCalendar(); renderDay(); } return; }
    const del = e.target.closest('[data-del]');
    if(del){ const k=keyOf(sel); data[k]=(data[k]||[]).filter(x=>x.id!==del.dataset.del); if(!data[k].length) delete data[k]; save(); renderCalendar(); renderDay(); return; }
  });

  // ---------- 初始 ----------
  renderCalendar();
  renderDay();
})();
</script>
</body>
</html>
