<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<title>我的笔记本</title>
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --text:#1f2430; --muted:#8a91a3; --line:#e7e9f0;
    --accent:#6c5ce7; --accent-soft:#efeaff; --danger:#e5484d; --ok:#2fbf71;
    --radius:14px; --shadow:0 1px 3px rgba(20,24,40,.06),0 8px 24px rgba(20,24,40,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  header{
    position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
    padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top,0px));
  }
  header .bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{font-size:19px;margin:0;font-weight:700}
  header .sub{font-size:12px;opacity:.85;margin-top:2px}
  .icon-btn{border:none;background:rgba(255,255,255,.18);color:#fff;width:38px;height:38px;border-radius:11px;
    cursor:pointer;font-size:17px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

  /* 科目栏 */
  .subject-bar{position:sticky;top:0;z-index:15;background:var(--bg);padding:10px 14px 8px}
  .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;transition:all .15s;user-select:none}
  .chip .dot{width:9px;height:9px;border-radius:50%}
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .chip.add{border-style:dashed;color:var(--muted)}

  main{max-width:900px;margin:0 auto;padding:10px 14px 110px}

  /* 章节列表 */
  .section-title{font-size:13px;color:var(--muted);margin:12px 4px 8px;font-weight:600}
  .chapter-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;
    box-shadow:var(--shadow);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:transform .12s}
  .chapter-row:active{transform:scale(.98)}
  .chapter-row.active{border:2px solid var(--accent);background:var(--accent-soft)}
  .chapter-row .icon{font-size:20px}
  .chapter-row .name{flex:1;font-size:15px;font-weight:600;min-width:0}
  .chapter-row .cnt{font-size:12px;color:var(--muted)}
  .chapter-row .del{opacity:0;border:none;background:transparent;color:var(--muted);cursor:pointer;
    font-size:15px;width:28px;height:28px;border-radius:8px;flex:0 0 auto}
  .chapter-row:hover .del{opacity:1}
  .chapter-row .del:hover{color:var(--danger);background:#fdeaeb}

  /* 笔记卡片 */
  .note{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;
    margin-bottom:10px;cursor:pointer;animation:fadein .18s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .note .t{font-size:16px;font-weight:600;margin-bottom:4px}
  .note .p{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .note .meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
  .note .thumb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .note .thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:46px;margin-bottom:10px}
  .empty h3{margin:0 0 6px;color:var(--text);font-size:16px}
  .empty p{margin:0;font-size:14px}

  /* 悬浮按钮 */
  .fab{position:fixed;right:18px;bottom:calc(24px + var(--safe-b));z-index:30;width:58px;height:58px;
    border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:28px;cursor:pointer;
    box-shadow:0 6px 20px rgba(108,92,231,.45);display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.92)}

  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(20,24,40,.45);z-index:40;display:flex;align-items:flex-end;
    justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .overlay.show{opacity:1;pointer-events:auto}
  .sheet{background:var(--card);width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:10px 18px calc(18px + var(--safe-b));
    max-height:92vh;overflow-y:auto;transform:translateY(20px);transition:transform .25s}
  .overlay.show .sheet{transform:none}
  .sheet .grab{width:40px;height:4px;background:var(--line);border-radius:99px;margin:4px auto 14px}
  .sheet h2{margin:0 0 16px;font-size:18px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field textarea,.field select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
    font-size:15px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;transition:border .15s}
  .field textarea{min-height:140px;resize:vertical;line-height:1.6}
  .field input:focus,.field textarea:focus{border-color:var(--accent)}
  .btn-row{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.ghost{background:var(--bg);color:var(--muted)}
  .btn.danger{background:#fdeaeb;color:var(--danger)}

  /* 图片区 */
  .img-grid{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .img-item{position:relative;width:88px;height:88px}
  .img-item img{width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .img-item .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--danger);
    color:#fff;border:none;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .add-img-btn{width:88px;height:88px;border:2px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--muted);
    font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}

  /* 全屏图片查看器 */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .2s;overflow:hidden}
  .lightbox.show{opacity:1;pointer-events:auto}
  .lightbox img{max-width:96vw;max-height:96vh;object-fit:contain;border-radius:6px;transform:scale(1);transition:transform .15s ease-out;
    cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
  .lightbox .lb-close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.15);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lightbox .lb-tip{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-size:12px;pointer-events:none}

  /* 笔记详情查看 */
  .view-title{font-size:20px;font-weight:700;margin:0 0 10px}
  .view-content{font-size:15px;white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .view-img{width:100%;border-radius:12px;margin:10px 0;border:1px solid var(--line)}

  @media (min-width:640px){
    .overlay{align-items:center;padding:24px}
    .sheet{border-radius:20px}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div>
      <h1>📓 我的笔记本</h1>
      <div class="sub">科目 → 章节 → 笔记，支持图片</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" id="btnSubject" title="管理科目">🏷️</button>
      <button class="icon-btn" id="btnMore" title="更多">⋯</button>
    </div>
  </div>
</header>

<div class="subject-bar">
  <div class="chips" id="subjectChips"></div>
</div>

<main>
  <div id="content"></div>
</main>

<button class="fab" id="fab" title="新建笔记">＋</button>

<!-- 笔记编辑弹窗 -->
<div class="overlay" id="noteOverlay">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="noteSheetTitle">新建笔记</h2>
    <div class="field">
      <label>标题</label>
      <input id="nTitle" placeholder="笔记标题" maxlength="80">
    </div>
    <div class="field">
      <label>内容</label>
      <textarea id="nContent" placeholder="写点什么…"></textarea>
    </div>
    <div class="field">
      <label>图片（可多张，自动压缩存储）</label>
      <div class="img-grid" id="imgGrid"></div>
      <input type="file" id="imgInput" accept="image/*" multiple style="display:none">
      <div class="hint">建议每张图不超过 2MB，会自动压缩</div>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="btnCancelNote">取消</button>
      <button class="btn primary" id="btnSaveNote">保存</button>
    </div>
  </div>
</div>

<!-- 科目管理弹窗 -->
<div class="overlay" id="subjectOverlay">
  <div class="sheet">
    <div class="grab"></div>
    <h2>管理科目</h2>
    <div id="subjectList" style="margin-bottom:16px"></div>
    <div style="border-top:1px solid var(--line);padding-top:14px">
      <h3 style="font-size:14px;margin:0 0 10px">新建科目</h3>
      <div class="field">
        <label>科目名称</label>
        <input id="sName" placeholder="如：数学 / 英语 / 编程" maxlength="20">
      </div>
      <div class="field">
        <label>颜色</label>
        <div class="img-grid" id="colorRow" style="gap:10px"></div>
      </div>
      <div class="btn-row">
        <button class="btn ghost" id="btnCancelSubject">关闭</button>
        <button class="btn primary" id="btnSaveSubject">添加科目</button>
      </div>
    </div>
  </div>
</div>

<!-- 章节编辑弹窗 -->
<div class="overlay" id="chapterOverlay">
  <div class="sheet">
    <div class="grab"></div>
    <h2 id="chapterSheetTitle">新建章节</h2>
    <div class="field">
      <label>章节名称</label>
      <input id="cName" placeholder="如：第一章 / 函数 / 第3课" maxlength="40">
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="btnCancelChapter">取消</button>
      <button class="btn primary" id="btnSaveChapter">保存</button>
    </div>
  </div>
</div>

<!-- 笔记查看弹窗 -->
<div class="overlay" id="viewOverlay">
  <div class="sheet">
    <div class="grab"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span style="font-size:12px;color:var(--muted)" id="viewMeta"></span>
      <div style="display:flex;gap:6px">
        <button class="btn ghost" id="btnEditNote" style="flex:none;padding:8px 14px;font-size:13px">✎ 编辑</button>
        <button class="btn danger" id="btnDelNote" style="flex:none;padding:8px 14px;font-size:13px">🗑 删除</button>
      </div>
    </div>
    <h2 class="view-title" id="viewTitle"></h2>
    <div class="view-content" id="viewContent"></div>
    <div id="viewImgs"></div>
    <div class="btn-row">
      <button class="btn ghost" id="btnCloseView">关闭</button>
    </div>
  </div>
</div>

<!-- 更多 -->
<div class="overlay" id="moreOverlay">
  <div class="sheet">
    <div class="grab"></div>
    <h2>更多</h2>
    <div class="btn-row" style="flex-direction:column">
      <button class="btn ghost" id="btnExport">📤 导出数据（备份）</button>
      <button class="btn ghost" id="btnImport">📥 导入数据</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="btn danger" id="btnClear">🗑️ 清空全部</button>
    </div>
  </div>
</div>

<!-- 全屏图片查看器 -->
<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="lb-tip">点击任意处关闭</div>
</div>

<script>
(function(){
  'use strict';

  const KEY = 'notebook-v1';
  const COLORS = ['#6c5ce7','#0984e3','#00b894','#e17055','#e84393','#00cec9','#d63031','#0984e3'];

  let data = load();
  function defaultData(){ return { subjects:[], chapters:[], notes:[] }; }
  function load(){
    try{ const d = JSON.parse(localStorage.getItem(KEY)); if(d && Array.isArray(d.subjects)) return d; }catch(e){}
    return defaultData();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){ alert('存储失败，可能空间不足，建议删除一些图片'); } }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  const $ = id => document.getElementById(id);
  let curSubject = null, curChapter = null, editingNoteId = null, pickColor = COLORS[0];

  function subjectById(id){ return data.subjects.find(s=>s.id===id); }
  function chaptersOf(subjectId){ return data.chapters.filter(c=>c.subjectId===subjectId); }
  function notesOf(chapterId){ return data.notes.filter(n=>n.chapterId===chapterId); }

  // ---------- 科目 chips ----------
  function renderSubjectChips(){
    let html = '';
    data.subjects.forEach(s=>{
      const active = curSubject===s.id;
      html += `<div class="chip ${active?'active':''}" data-subj="${s.id}"><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</div>`;
    });
    html += `<div class="chip add" data-addsubj>＋ 科目</div>`;
    $('subjectChips').innerHTML = html;
  }

  // ---------- 主内容 ----------
  function renderContent(){
    if(!curSubject){
      $('content').innerHTML = `<div class="empty"><div class="big">📚</div><h3>先创建一个科目</h3><p>点击上方「＋ 科目」开始</p></div>`;
      return;
    }
    const chapters = chaptersOf(curSubject);
    let html = `<div class="section-title">${esc(subjectById(curSubject).name)} 的章节</div>`;
    if(chapters.length===0){
      html += `<div class="empty"><div class="big">📖</div><p>还没有章节，点右下角 ＋ 新建</p></div>`;
    }
    chapters.forEach(c=>{
      const cnt = notesOf(c.id).length;
      const active = curChapter===c.id;
      html += `<div class="chapter-row ${active?'active':''}" data-chapter="${c.id}">
        <span class="icon">📄</span>
        <span class="name">${esc(c.name)}</span>
        <span class="cnt">${cnt} 篇</span>
        <button class="del" data-delchap="${c.id}" title="删除章节">✕</button>
      </div>`;
    });
    // 显示当前章节的笔记
    if(curChapter){
      const notes = notesOf(curChapter);
      const chap = data.chapters.find(c=>c.id===curChapter);
      html += `<div class="section-title" style="margin-top:20px">「${esc(chap?chap.name:'')}」的笔记（${notes.length}）</div>`;
      if(notes.length===0){
        html += `<div class="empty"><div class="big">📝</div><p>这个章节还没有笔记，点右下角 ＋ 新建</p></div>`;
      }
      notes.sort((a,b)=>(b.updated||0)-(a.updated||0)).forEach(n=>{
        const imgs = (n.images||[]).slice(0,3);
        html += `<div class="note" data-note="${n.id}">
          <div class="t">${esc(n.title)||'（无标题）'}</div>
          <div class="p">${esc(n.content)||''}</div>
          ${imgs.length?`<div class="thumb">${imgs.map(i=>`<img src="${i}">`).join('')}</div>`:''}
          <div class="meta">📅 ${fmt(n.updated||n.created)} ${n.images&&n.images.length?`· 🖼 ${n.images.length}张`:''}</div>
        </div>`;
      });
    }
    $('content').innerHTML = html;
  }

  function fmt(ts){ const d=new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  // ---------- 科目 ----------
  $('btnSubject').onclick = ()=>{ renderSubjectList(); $('sName').value=''; $('subjectOverlay').classList.add('show'); };
  $('subjectChips').addEventListener('click', e=>{
    const add = e.target.closest('[data-addsubj]');
    if(add){ renderSubjectList(); $('sName').value=''; $('subjectOverlay').classList.add('show'); return; }
    const chip = e.target.closest('[data-subj]');
    if(chip){ curSubject = chip.dataset.subj; curChapter = null; renderAll(); }
  });

  function renderColorRow(){
    $('colorRow').innerHTML = COLORS.map(c=>`<div class="img-item" style="width:34px;height:34px;border-radius:50%;background:${c};cursor:pointer;border:${c===pickColor?'3px solid var(--text)':'2px solid transparent'}" data-color="${c}"></div>`).join('');
  }
  $('colorRow').addEventListener('click', e=>{ const d=e.target.closest('[data-color]'); if(d){ pickColor=d.dataset.color; renderColorRow(); } });

  function renderSubjectList(){
    let html='';
    if(data.subjects.length===0) html='<div class="empty" style="padding:20px"><p>还没有科目</p></div>';
    data.subjects.forEach(s=>{
      html += `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)">
        <span class="dot" style="width:12px;height:12px;border-radius:50%;background:${s.color};flex:0 0 auto"></span>
        <span style="flex:1;font-size:15px">${esc(s.name)}</span>
        <button class="mini-btn danger" data-delsubj="${s.id}" style="border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px">✕</button>
      </div>`;
    });
    $('subjectList').innerHTML = html;
  }
  $('subjectList').addEventListener('click', e=>{
    const del = e.target.closest('[data-delsubj]');
    if(!del) return;
    const id = del.dataset.delsubj;
    if(!confirm('删除科目会同时删除它的所有章节和笔记，确定？')) return;
    data.subjects = data.subjects.filter(s=>s.id!==id);
    const chapIds = data.chapters.filter(c=>c.subjectId===id).map(c=>c.id);
    data.chapters = data.chapters.filter(c=>c.subjectId!==id);
    data.notes = data.notes.filter(n=>!chapIds.includes(n.chapterId));
    if(curSubject===id){ curSubject=null; curChapter=null; }
    save(); renderSubjectList(); renderAll();
  });
  $('btnSaveSubject').onclick = ()=>{
    const name = $('sName').value.trim();
    if(!name){ $('sName').focus(); return; }
    data.subjects.push({ id:uid(), name, color:pickColor });
    save(); renderSubjectList(); renderAll();
    $('sName').value='';
  };
  $('btnCancelSubject').onclick = ()=> $('subjectOverlay').classList.remove('show');
  $('subjectOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) $('subjectOverlay').classList.remove('show'); });

  // ---------- 章节 ----------
  $('content').addEventListener('click', e=>{
    const del = e.target.closest('[data-delchap]');
    if(del){
      e.stopPropagation();
      const id = del.dataset.delchap;
      if(!confirm('删除章节会同时删除它的所有笔记，确定？')) return;
      data.chapters = data.chapters.filter(c=>c.id!==id);
      data.notes = data.notes.filter(n=>n.chapterId!==id);
      if(curChapter===id) curChapter=null;
      save(); renderAll(); return;
    }
    const chap = e.target.closest('[data-chapter]');
    if(chap){ curChapter = chap.dataset.chapter; renderAll(); return; }
    const note = e.target.closest('[data-note]');
    if(note){ openView(note.dataset.note); return; }
  });

  // ---------- 新建/编辑笔记 ----------
  $('fab').onclick = ()=>{
    if(!curSubject){ alert('请先创建一个科目'); $('subjectOverlay').classList.add('show'); return; }
    if(!curChapter){ alert('请先点击一个章节，或新建章节'); openChapterModal(); return; }
    openNoteModal(null);
  };

  function openChapterModal(){
    $('chapterSheetTitle').textContent='新建章节';
    $('cName').value='';
    $('chapterOverlay').classList.add('show');
    setTimeout(()=>$('cName').focus(),250);
  }
  $('btnSaveChapter').onclick = ()=>{
    const name = $('cName').value.trim();
    if(!name){ $('cName').focus(); return; }
    data.chapters.push({ id:uid(), subjectId:curSubject, name });
    curChapter = data.chapters[data.chapters.length-1].id;
    save(); renderAll(); $('chapterOverlay').classList.remove('show');
  };
  $('btnCancelChapter').onclick = ()=> $('chapterOverlay').classList.remove('show');
  $('chapterOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) $('chapterOverlay').classList.remove('show'); });

  // 笔记编辑
  let tempImages = [];
  function openNoteModal(id){
    editingNoteId = id||null;
    tempImages = [];
    const n = id ? data.notes.find(x=>x.id===id) : null;
    $('noteSheetTitle').textContent = n ? '编辑笔记' : '新建笔记';
    $('nTitle').value = n ? n.title : '';
    $('nContent').value = n ? n.content : '';
    if(n) tempImages = (n.images||[]).slice();
    renderImgGrid();
    $('noteOverlay').classList.add('show');
  }
  function renderImgGrid(){
    let html = tempImages.map((img,i)=>`<div class="img-item"><img src="${img}" data-zoom="${i}"><button class="x" data-rmimg="${i}">✕</button></div>`).join('');
    html += `<button class="add-img-btn" id="addImgBtn">＋</button>`;
    $('imgGrid').innerHTML = html;
    const btn = document.getElementById('addImgBtn');
    if(btn) btn.onclick = ()=> $('imgInput').click();
  }
  $('imgGrid').addEventListener('click', e=>{
    const rm = e.target.closest('[data-rmimg]');
    if(rm){ e.stopPropagation(); tempImages.splice(parseInt(rm.dataset.rmimg),1); renderImgGrid(); return; }
    const z = e.target.closest('[data-zoom]');
    if(z){ openLightbox(tempImages[parseInt(z.dataset.zoom)]); }
  });
  $('imgInput').addEventListener('change', e=>{
    const files = Array.from(e.target.files);
    e.target.value='';
    if(!files.length) return;
    // 批量处理：一次性压缩完所有图，只重画一次，避免每张卡一次
    compressAll(files, (dataUrls)=>{
      tempImages = tempImages.concat(dataUrls);
      renderImgGrid();
    });
  });

  function compressImage(file){
    return new Promise((resolve)=>{
      const reader = new FileReader();
      reader.onload = ev=>{
        const img = new Image();
        img.onload = ()=>{
          const maxW = 900;
          let w = img.width, h = img.height;
          if(w > maxW){ h = h*maxW/w; w = maxW; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = ()=>resolve(null);
        img.src = ev.target.result;
      };
      reader.onerror = ()=>resolve(null);
      reader.readAsDataURL(file);
    });
  }

  async function compressAll(files, cb){
    const results = [];
    // 显示处理中状态
    const btn = document.getElementById('addImgBtn');
    if(btn) btn.textContent = '…';
    for(const f of files){
      // 让出主线程，避免连续压缩卡死界面
      await new Promise(r=>setTimeout(r, 0));
      const url = await compressImage(f);
      if(url) results.push(url);
    }
    if(btn) btn.textContent = '＋';
    cb(results);
  }

  $('btnSaveNote').onclick = ()=>{
    const title = $('nTitle').value.trim();
    const content = $('nContent').value;
    if(!title && !content && tempImages.length===0){ alert('笔记是空的'); return; }
    if(editingNoteId){
      const n = data.notes.find(x=>x.id===editingNoteId);
      if(n){ n.title=title; n.content=content; n.images=tempImages; n.updated=Date.now(); }
    }else{
      data.notes.push({ id:uid(), chapterId:curChapter, title, content, images:tempImages, created:Date.now(), updated:Date.now() });
    }
    save(); renderAll(); $('noteOverlay').classList.remove('show');
  };
  $('btnCancelNote').onclick = ()=> $('noteOverlay').classList.remove('show');
  $('noteOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) $('noteOverlay').classList.remove('show'); });

  // ---------- 查看笔记 ----------
  let viewingId = null;
  function openView(id){
    const n = data.notes.find(x=>x.id===id);
    if(!n) return;
    viewingId = id;
    $('viewTitle').textContent = n.title||'（无标题）';
    $('viewContent').textContent = n.content||'';
    $('viewMeta').textContent = '📅 ' + fmt(n.updated||n.created);
    $('viewImgs').innerHTML = (n.images||[]).map(i=>`<img class="view-img" src="${i}" style="cursor:zoom-in">`).join('');
    $('viewOverlay').classList.add('show');
  }
  $('viewImgs').addEventListener('click', e=>{
    const img = e.target.closest('img.view-img');
    if(img) openLightbox(img.src);
  });

  // 全屏图片查看器
  let lbScale = 1;              // 当前缩放倍数
  const LB_MIN = 1, LB_MAX = 5; // 上下限：1倍 ~ 5倍
  function openLightbox(src){
    $('lbImg').src = src;
    lbScale = 1;
    $('lbImg').style.transform = 'scale(1)';
    $('lightbox').classList.add('show');
  }
  function closeLightbox(){ $('lightbox').classList.remove('show'); }
  $('lbClose').onclick = closeLightbox;
  $('lightbox').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeLightbox(); });

  // 滚轮缩放
  $('lightbox').addEventListener('wheel', e=>{
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.2 : -0.2; // 向上滚放大，向下滚缩小
    lbScale = Math.min(LB_MAX, Math.max(LB_MIN, lbScale + delta));
    $('lbImg').style.transform = `scale(${lbScale})`;
  }, { passive:false });

  // 拖拽平移（放大后可拖动查看）
  let dragging = false, startX = 0, startY = 0, imgX = 0, imgY = 0;
  const lbImg = $('lbImg');
  lbImg.addEventListener('mousedown', e=>{
    dragging = true; startX = e.clientX - imgX; startY = e.clientY - imgY;
    lbImg.style.cursor = 'grabbing'; e.preventDefault();
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    imgX = e.clientX - startX; imgY = e.clientY - startY;
    lbImg.style.transform = `scale(${lbScale}) translate(${imgX}px, ${imgY}px)`;
  });
  window.addEventListener('mouseup', ()=>{ dragging = false; lbImg.style.cursor = 'grab'; });

  // 触屏：单指拖动，双指缩放
  let pinchDist = 0;
  lbImg.addEventListener('touchstart', e=>{
    if(e.touches.length === 1){
      dragging = true; startX = e.touches[0].clientX - imgX; startY = e.touches[0].clientY - imgY;
    } else if(e.touches.length === 2){
      dragging = false;
      pinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive:false });
  lbImg.addEventListener('touchmove', e=>{
    if(e.touches.length === 1 && dragging){
      imgX = e.touches[0].clientX - startX; imgY = e.touches[0].clientY - startY;
      lbImg.style.transform = `scale(${lbScale}) translate(${imgX}px, ${imgY}px)`;
    } else if(e.touches.length === 2){
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const ratio = d / pinchDist;
      lbScale = Math.min(LB_MAX, Math.max(LB_MIN, lbScale * ratio));
      pinchDist = d;
      lbImg.style.transform = `scale(${lbScale}) translate(${imgX}px, ${imgY}px)`;
    }
  }, { passive:false });
  lbImg.addEventListener('touchend', ()=>{ dragging = false; });
  $('btnCloseView').onclick = ()=> $('viewOverlay').classList.remove('show');
  $('btnEditNote').onclick = ()=>{ const id=viewingId; $('viewOverlay').classList.remove('show'); openNoteModal(id); };
  $('btnDelNote').onclick = ()=>{
    if(!confirm('删除这篇笔记？')) return;
    data.notes = data.notes.filter(n=>n.id!==viewingId);
    save(); renderAll(); $('viewOverlay').classList.remove('show');
  };
  $('viewOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) $('viewOverlay').classList.remove('show'); });

  // ---------- 更多 ----------
  $('btnMore').onclick = ()=> $('moreOverlay').classList.add('show');
  $('moreOverlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) $('moreOverlay').classList.remove('show'); });
  $('btnExport').onclick = ()=>{
    const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href=url; a.download='笔记本备份-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); URL.revokeObjectURL(url);
  };
  $('btnImport').onclick = ()=> $('importFile').click();
  $('importFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{ const d = JSON.parse(r.result); if(d && Array.isArray(d.subjects)){ data=d; save(); renderAll(); $('moreOverlay').classList.remove('show'); alert('导入成功'); } else throw 0; }
      catch(err){ alert('导入失败：文件格式不对'); }
    };
    r.readAsText(f); e.target.value='';
  };
  $('btnClear').onclick = ()=>{
    if(!confirm('清空全部科目、章节和笔记？不可撤销，建议先导出备份。')) return;
    data = defaultData(); save(); curSubject=null; curChapter=null; renderAll(); $('moreOverlay').classList.remove('show');
  };

  function renderAll(){ renderSubjectChips(); renderContent(); }

  renderColorRow();
  renderAll();
})();
</script>
</body>
</html>
